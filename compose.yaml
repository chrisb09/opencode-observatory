services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: observatory_bootstrap
      POSTGRES_DB: observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm run setup:env}
    volumes:
      # Persistent PostgreSQL storage volume:
      # Defaults to the named Docker volume "pgdata". Set PGDATA_SOURCE in .env (e.g. ./data/postgres or /var/data/observatory)
      # if you want to mount a specific host directory instead.
      - ${PGDATA_SOURCE:-pgdata}:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory_bootstrap -d observatory"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:7693:5432"
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://observatory_app:${APP_DB_PASSWORD}@db:5432/observatory
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run npm run setup:env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:7692}
      NODE_ENV: production
      PORT: 7692
      WEB_ROOT: /app/apps/web/dist
      # Optional: set ADMIN_EMAIL and ADMIN_PASSWORD in your .env file to automatically provision
      # the initial administrator on container startup without executing manual commands.
      # If an administrator already exists in the database, these variables are safely ignored.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "7692:7692"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7692/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  pgdata:
    # Named volume for database persistence across container recreations.
